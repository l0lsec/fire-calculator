name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: node scripts/guards/run-all.mjs --selftest
      - run: node scripts/guards/run-all.mjs
      # Unit and integration suites (PGlite). Tests that need the local Supabase
      # stack or Plaid Sandbox keys skip here; their gates run them locally.
      - run: pnpm test
      - run: node scripts/verify-plan.mjs tickets && node scripts/verify-plan.mjs example
